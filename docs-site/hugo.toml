# Fluence.Wpf documentation site - Hugo configuration.
#
# Conceptual docs are rendered with Hugo + Hextra. API reference is
# generated separately by DocFX and merged into /api/ during the build
# pipeline (see ../.github/workflows/docs.yml and ./scripts/build-docs.ps1).

baseURL = "https://sintaxasn.github.io/Fluence.Wpf/"
locale = "en-us"
title = "Fluence.Wpf"
enableRobotsTXT = true
enableGitInfo = true
hasCJKLanguage = false

# Suppress kinds the docs site does not use. Hextra's bundled
# list.rss.xml references .Site.Author.email, which trips Hugo's
# strict template type-check; disabling RSS plus taxonomy/term
# avoids rendering taxonomy list/term pages that the docs site does
# not navigate to anyway.
disableKinds = ["taxonomy", "term", "RSS"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.parser]
      [markup.goldmark.parser.attribute]
        block = true
        title = true
  [markup.highlight]
    noClasses = false
    style = "github-dark"
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4

[module]
  [[module.imports]]
    path = "github.com/imfing/hextra"

  # Sync repo-level conceptual docs into the Hextra docs section so the
  # markdown source of truth keeps living under ../docs/. Maintainer-only
  # files stay out of the public navigation.
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "../docs/getting-started.md"
    target = "content/docs/getting-started.md"
  [[module.mounts]]
    source = "../docs/theming.md"
    target = "content/docs/theming.md"
  [[module.mounts]]
    source = "../docs/controls.md"
    target = "content/docs/controls.md"
  [[module.mounts]]
    source = "../docs/migration-guide.md"
    target = "content/docs/migration-guide.md"
  [[module.mounts]]
    source = "../docs/contributing.md"
    target = "content/docs/contributing.md"
  [[module.mounts]]
    source = "../docs/screenshots"
    target = "static/images/screenshots"
  [[module.mounts]]
    source = "../docs/images"
    target = "static/images"
  [[module.mounts]]
    source = "../assets"
    target = "static/assets"

  # Surface root-level markdown (CHANGELOG, KNOWN_ISSUES) as Hugo
  # resources so the `readroot` shortcode can inline them without
  # duplicating content in the docs-site tree. Mount the files directly
  # so Hugo server does not watch docs-site/public through a broad repo
  # root mount and trigger rebuild loops after every generated write.
  [[module.mounts]]
    source = "../CHANGELOG.md"
    target = "assets/_root/CHANGELOG.md"
  [[module.mounts]]
    source = "../KNOWN_ISSUES.md"
    target = "assets/_root/KNOWN_ISSUES.md"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"

[params]
  description = "Windows 11 Fluent Design controls and theming for WPF (.NET Framework 4.7.2 and .NET 10)."
  images = ["assets/fluence-wpf-og-card-light.png"]

  [params.navbar]
    displayTitle = true
    displayLogo = true
    [params.navbar.logo]
      path = "images/fluence-wpf-appicon-1024.png"
      dark = "images/fluence-wpf-appicon-1024.png"
      width = 28
      height = 28
      link = "/Fluence.Wpf/"

  [params.favicon]
    light = "/images/fluence-wpf-appicon-1024.png"
    dark = "/images/fluence-wpf-appicon-1024.png"

  [params.theme]
    default = "system"
    displayToggle = true

  [params.page]
    width = "wide"

  [params.toc]
    displayTags = true

  [params.footer]
    enable = true
    displayCopyright = true
    displayPoweredBy = false

  [params.editURL]
    enable = true
    base = "https://github.com/sintaxasn/Fluence.Wpf/edit/main/docs"

  [params.search]
    enable = true
    type = "flexsearch"
    [params.search.flexsearch]
      index = "content"
      tokenize = "forward"

[[menu.main]]
  identifier = "docs"
  name = "Documentation"
  pageRef = "/docs"
  weight = 10

[[menu.main]]
  identifier = "api"
  name = "API Reference"
  url = "/api/"
  weight = 30

[[menu.main]]
  identifier = "screenshots"
  name = "Screenshots"
  pageRef = "/screenshots"
  weight = 20

[[menu.main]]
  identifier = "changelog"
  name = "Changelog"
  pageRef = "/changelog"
  weight = 40

[[menu.main]]
  identifier = "github"
  name = "GitHub"
  url = "https://github.com/sintaxasn/Fluence.Wpf"
  weight = 50
  [menu.main.params]
    icon = "github"

# RSS is intentionally disabled: this is a docs site, not a blog, and
# Hextra's list.rss.xml template expects .Site.Author.email which we do
# not publish. Hextra's flexsearch builds its index by templating the
# flexsearch.js asset directly, so no JSON output format is required.
[outputs]
  home = ["HTML"]
  section = ["HTML"]
  page = ["HTML"]

# Provide a default author so any theme template that still touches
# .Site.Author.* falls back to a sensible value instead of failing.
[author]
  name = "Fluence.Wpf contributors"
  email = ""

[security]
  # `git` is required by enableGitInfo so Hugo can populate
  # .Lastmod / .GitInfo from the repository history.
  [security.exec]
    allow = ['^(dart-)?sass(-embedded)?$', '^go$', '^git$', '^npx$', '^postcss$']
    osEnv = ['(?i)^((HTTPS?|NO)_PROXY|PATH(EXT)?|APPDATA|TE?MP|TERM|GO\w+|(XDG_CONFIG_)?HOME|USERPROFILE)$']
  [security.funcs]
    getenv = ['^HUGO_', '^CI$']
