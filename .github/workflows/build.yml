name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Fluence.Wpf.sln

      - name: Build (Debug)
        run: dotnet build Fluence.Wpf.sln -c Debug --no-restore -v minimal

      - name: Build (Release)
        run: dotnet build Fluence.Wpf.sln -c Release --no-restore -v minimal

      - name: Test
        run: dotnet test Fluence.Wpf.sln -c Release --no-build --verbosity normal

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fluence-wpf-release
          path: |
            Fluence.Wpf/bin/Release/net472/Fluence.Wpf.dll
            Fluence.Wpf/bin/Release/net472/Fluence.Wpf.pdb
            Fluence.Wpf/bin/Release/net472/Fluence.Wpf.xml
          retention-days: 30
