name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Fluence.Wpf.sln

      - name: Build library (Release)
        run: dotnet build Fluence.Wpf/Fluence.Wpf.csproj -c Release --no-restore -v minimal

      - name: Build demo (Release)
        run: dotnet build Fluence.Wpf.Demo/Fluence.Wpf.Demo.csproj -c Release --no-restore -v minimal

      - name: Build tests (Release)
        run: dotnet build Fluence.Wpf.Tests/Fluence.Wpf.Tests.csproj -c Release --no-restore -v minimal

      - name: Test
        run: dotnet test Fluence.Wpf.Tests/Fluence.Wpf.Tests.csproj -c Release --no-build --verbosity normal

      - name: Upload library artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fluence-wpf-release
          path: |
            Fluence.Wpf/bin/Release/net472/Fluence.Wpf.dll
            Fluence.Wpf/bin/Release/net472/Fluence.Wpf.pdb
            Fluence.Wpf/bin/Release/net472/Fluence.Wpf.xml
          retention-days: 30

      - name: Upload demo application
        uses: actions/upload-artifact@v4
        with:
          name: fluence-wpf-demo
          path: Fluence.Wpf.Demo/bin/Release/net472/
          retention-days: 30

