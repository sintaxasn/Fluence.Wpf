name: Docs

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - docs-site/**
      - assets/**
      - Fluence.Wpf/**
      - CHANGELOG.md
      - KNOWN_ISSUES.md
      - README.md
      - .github/workflows/docs.yml
  workflow_dispatch:

# Allow the workflow to publish to GitHub Pages via the deploy-pages action.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment may be in flight at a time.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: '0.161.1'
  HUGO_EXTENDED: 'true'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  build:
    name: Build docs site
    # Windows runner matches build.yml so the WPF library compiles cleanly
    # and Fluence.Wpf.xml is available for DocFX.
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0          # required for Hugo's enableGitInfo (lastmod)

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Setup Go
        # Hugo Modules require Go to resolve theme imports (github.com/imfing/hextra).
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Setup Hugo Extended
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Cache Hugo modules
        uses: actions/cache@v5
        with:
          path: |
            ~/AppData/Local/hugo_cache
            ~/.cache/hugo_cache
          key: ${{ runner.os }}-hugomod-${{ hashFiles('docs-site/go.mod') }}
          restore-keys: |
            ${{ runner.os }}-hugomod-

      - name: Install DocFX
        run: dotnet tool install -g docfx
        shell: pwsh

      - name: Restore Fluence.Wpf
        run: dotnet restore Fluence.Wpf/Fluence.Wpf.csproj
        shell: pwsh

      - name: Resolve Hugo modules
        working-directory: docs-site
        run: hugo mod get -u ./...
        shell: pwsh

      - name: Build docs site (library + DocFX + Hugo + merge)
        run: pwsh ./docs-site/scripts/build-docs.ps1
        shell: pwsh

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/public

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
